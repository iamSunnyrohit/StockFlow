services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockflow_db
      POSTGRES_USER: stockflow_user
      POSTGRES_PASSWORD: stockflow_dev_password
    ports:
      - "15432:5432"
    volumes:
      - stockflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow_user -d stockflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockflow_postgres_data:
